name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Upload static export over FTP. Required secrets:
      #   FTP_SERVER   = 31.31.196.254
      #   FTP_USERNAME = u3698395
      #   FTP_PASSWORD = <FTP password from hosting panel>
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: www/hawaii22.ru/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
